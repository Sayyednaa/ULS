{% extends 'base.html' %}
{% load static %}

{% block title %}{{ request.user.company.name|default:"FleetOps" }} - P&L{% endblock %}

{% block content %}
<div class="space-y-6" x-data="pnlManager()">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
            <h1 class="text-2xl font-bold text-app-text tracking-tight" x-text="t('Profit & Loss')"></h1>
            <p class="text-sm text-app-text-muted mt-1">Dashboard and Expense Management</p>
        </div>
        <div class="flex flex-col sm:flex-row items-center gap-4">
            <form method="GET" class="flex items-center gap-2 bg-app-card border border-app-border rounded-xl px-2 py-1 shadow-sm">
                <input type="date" name="start_date" value="{{ start_date }}" class="bg-transparent border-none text-sm focus:ring-0 text-app-text-muted cursor-pointer">
                <span class="text-app-text-muted text-sm">to</span>
                <input type="date" name="end_date" value="{{ end_date }}" class="bg-transparent border-none text-sm focus:ring-0 text-app-text-muted cursor-pointer">
                <button type="submit" class="p-1.5 bg-brand/10 text-brand rounded-lg hover:bg-brand hover:text-white transition-colors" title="Filter">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
                </button>
                {% if start_date or end_date %}
                <a href="{% url 'pnl_dashboard' %}" class="p-1.5 bg-red-500/10 text-red-500 rounded-lg hover:bg-red-500 hover:text-white transition-colors" title="Clear">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </a>
                {% endif %}
            </form>
            <button @click="isAddModalOpen = true" class="px-4 py-2 bg-brand text-white rounded-xl font-medium shadow-sm hover:bg-brand/90 transition-colors flex items-center gap-2 whitespace-nowrap">
                <span>+</span> <span x-text="t('Add Details')"></span>
            </button>
        </div>
    </div>

    <!-- Dashboard Content -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Contract Wise P&L Graph -->
        <div class="bg-app-card rounded-2xl border border-app-border p-6 shadow-sm">
            <h3 class="text-lg font-bold text-app-text mb-4" x-text="t('Contract Wise P&L')"></h3>
            <div class="relative h-72">
                <canvas id="contractChart"></canvas>
            </div>
        </div>

        <!-- Driver Wise P&L Graph -->
        <div class="bg-app-card rounded-2xl border border-app-border p-6 shadow-sm">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-app-text" x-text="t('Driver Wise P&L')"></h3>
                <select x-model="selectedGraphDriver" @change="updateDriverChart()" class="bg-app-bg border border-app-border text-sm rounded-lg px-3 py-1.5 focus:ring-brand focus:border-brand w-48">
                    <option value="">Select a Driver...</option>
                    <template x-for="driver in drivers" :key="driver.id">
                        <option :value="driver.id" x-text="driver.full_name"></option>
                    </template>
                </select>
            </div>
            <div class="relative h-72">
                <canvas id="driverChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Add Details Modal -->
    <div x-show="isAddModalOpen" style="display: none;" class="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div x-show="isAddModalOpen" x-transition:enter="ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 bg-transparent transition-opacity" @click="isAddModalOpen = false" aria-hidden="true"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <div x-show="isAddModalOpen" x-transition:enter="ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95" x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100" x-transition:leave="ease-in duration-200" x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100" x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95" class="relative z-10 inline-block align-bottom bg-app-card rounded-2xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-xl w-full">
                <div class="px-6 py-5 border-b border-app-border">
                    <h3 class="text-lg leading-6 font-medium text-app-text" x-text="t('Add Details')"></h3>
                </div>
                <div class="px-6 py-5 space-y-4">
                    <!-- Driver Search -->
                    <div class="relative">
                        <label class="block text-xs font-bold text-app-text-muted mb-1" x-text="t('Driver *')"></label>
                        <div class="relative">
                            <input type="text" x-model="searchQuery" @focus="dropdownOpen = true" @click.away="dropdownOpen = false" placeholder="Search driver..." class="w-full px-3 py-2 border border-app-border rounded-xl text-sm focus:ring-2 focus:ring-brand focus:border-brand">
                            <div x-show="dropdownOpen" class="absolute z-10 w-full mt-1 bg-app-bg border border-app-border rounded-xl shadow-lg max-h-48 overflow-y-auto">
                                <template x-for="driver in filteredDrivers" :key="driver.id">
                                    <div @click="selectDriver(driver)" class="px-4 py-2 hover:bg-black/5 dark:hover:bg-white/5 cursor-pointer text-sm">
                                        <div class="font-medium text-app-text" x-text="driver.full_name"></div>
                                        <div class="text-xs text-app-text-muted" x-text="driver.civil_id_number"></div>
                                    </div>
                                </template>
                            </div>
                        </div>
                        <div x-show="selectedDriver" class="mt-2 text-sm text-brand font-medium flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            <span x-text="selectedDriver ? selectedDriver.full_name : ''"></span>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-app-text-muted mb-1" x-text="t('Petrol')"></label>
                            <input type="number" step="0.001" x-model.number="form.petrol" class="w-full px-3 py-2 border border-app-border rounded-xl text-sm focus:ring-2 focus:ring-brand focus:border-brand">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-app-text-muted mb-1" x-text="t('Oil Change')"></label>
                            <input type="number" step="0.001" x-model.number="form.oil_change" class="w-full px-3 py-2 border border-app-border rounded-xl text-sm focus:ring-2 focus:ring-brand focus:border-brand">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-app-text-muted mb-1" x-text="t('Repair Vehicle')"></label>
                            <input type="number" step="0.001" x-model.number="form.repair_vehicle" class="w-full px-3 py-2 border border-app-border rounded-xl text-sm focus:ring-2 focus:ring-brand focus:border-brand">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-app-text-muted mb-1" x-text="t('Room Rent')"></label>
                            <input type="number" step="0.001" x-model.number="form.room_rent" class="w-full px-3 py-2 border border-app-border rounded-xl text-sm focus:ring-2 focus:ring-brand focus:border-brand">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-app-text-muted mb-1" x-text="t('SIM Recharge')"></label>
                            <input type="number" step="0.001" x-model.number="form.sim_recharge" class="w-full px-3 py-2 border border-app-border rounded-xl text-sm focus:ring-2 focus:ring-brand focus:border-brand">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-app-text-muted mb-1" x-text="t('Car Rent')"></label>
                            <input type="number" step="0.001" x-model.number="form.car_rent" class="w-full px-3 py-2 border border-app-border rounded-xl text-sm focus:ring-2 focus:ring-brand focus:border-brand">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-app-text-muted mb-1" x-text="t('EMP Salary')"></label>
                            <input type="number" step="0.001" x-model.number="form.emp_salary" class="w-full px-3 py-2 border border-app-border rounded-xl text-sm focus:ring-2 focus:ring-brand focus:border-brand">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-brand mb-1" x-text="t('Total Expense')"></label>
                            <input type="number" readonly :value="totalExpense" class="w-full px-3 py-2 border border-app-border rounded-xl text-sm bg-black/5 dark:bg-white/5 font-bold text-brand">
                        </div>
                    </div>
                </div>
                <div class="px-6 py-4 border-t border-app-border flex justify-end gap-3 bg-app-bg/50">
                    <button type="button" @click="isAddModalOpen = false" class="px-4 py-2 bg-black/5 hover:bg-black/10 dark:bg-white/5 dark:hover:bg-white/10 text-app-text rounded-xl text-sm font-medium transition-colors" x-text="t('Cancel')"></button>
                    <button type="button" @click="saveExpense" :disabled="isSaving" class="px-6 py-2 bg-brand hover:bg-brand/90 text-white rounded-xl text-sm font-medium transition-colors disabled:opacity-50 flex items-center gap-2">
                        <span x-show="!isSaving" x-text="t('Save')"></span>
                        <span x-show="isSaving">Saving...</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function pnlManager() {
        return {
            isAddModalOpen: false,
            isSaving: false,
            drivers: {{ drivers_json|safe|default:"[]" }},
            searchQuery: '',
            dropdownOpen: false,
            selectedDriver: null,
            selectedGraphDriver: '',
            
            form: {
                petrol: 0,
                oil_change: 0,
                repair_vehicle: 0,
                room_rent: 0,
                sim_recharge: 0,
                car_rent: 0,
                emp_salary: 0
            },
            
            contractNames: {{ contract_names_json|safe|default:"[]" }},
            contractTotals: {{ contract_totals_json|safe|default:"[]" }},
            driverExpensesData: {{ driver_expenses_json|safe|default:"{}" }},
            
            driverChartInstance: null,

            init() {
                this.initContractChart();
            },
            
            get filteredDrivers() {
                if (!this.searchQuery) return this.drivers.slice(0, 50);
                const q = this.searchQuery.toLowerCase();
                return this.drivers.filter(d => 
                    (d.full_name && d.full_name.toLowerCase().includes(q)) || 
                    (d.civil_id_number && d.civil_id_number.includes(q))
                ).slice(0, 50);
            },
            
            selectDriver(driver) {
                this.selectedDriver = driver;
                this.searchQuery = driver.full_name;
                this.dropdownOpen = false;
            },
            
            get totalExpense() {
                return (
                    (parseFloat(this.form.petrol) || 0) +
                    (parseFloat(this.form.oil_change) || 0) +
                    (parseFloat(this.form.repair_vehicle) || 0) +
                    (parseFloat(this.form.room_rent) || 0) +
                    (parseFloat(this.form.sim_recharge) || 0) +
                    (parseFloat(this.form.car_rent) || 0) +
                    (parseFloat(this.form.emp_salary) || 0)
                ).toFixed(3);
            },
            
            initContractChart() {
                const ctx = document.getElementById('contractChart').getContext('2d');
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: this.contractNames,
                        datasets: [{
                            label: 'Total Expenses (KWD)',
                            data: this.contractTotals,
                            backgroundColor: 'rgba(59, 130, 246, 0.5)',
                            borderColor: 'rgb(59, 130, 246)',
                            borderWidth: 1,
                            borderRadius: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        }
                    }
                });
            },
            
            updateDriverChart() {
                const ctx = document.getElementById('driverChart').getContext('2d');
                if (this.driverChartInstance) {
                    this.driverChartInstance.destroy();
                }
                
                if (!this.selectedGraphDriver || !this.driverExpensesData[this.selectedGraphDriver]) {
                    return;
                }
                
                const data = this.driverExpensesData[this.selectedGraphDriver].breakdown;
                
                this.driverChartInstance = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Petrol', 'Oil Change', 'Repair Vehicle', 'Room Rent', 'SIM Recharge', 'Car Rent', 'EMP Salary'],
                        datasets: [{
                            data: data,
                            backgroundColor: [
                                '#ef4444', '#f97316', '#eab308', 
                                '#22c55e', '#3b82f6', '#8b5cf6', '#ec4899'
                            ],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'right' }
                        }
                    }
                });
            },
            
            async saveExpense() {
                if (!this.selectedDriver) {
                    alert(this.t('Driver is required'));
                    return;
                }
                
                this.isSaving = true;
                const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]') ? document.querySelector('[name=csrfmiddlewaretoken]').value : '{{ csrf_token }}';
                
                try {
                    const response = await fetch("{% url 'expense_add' %}", {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': csrfToken
                        },
                        body: JSON.stringify({
                            driver_id: this.selectedDriver.id,
                            ...this.form
                        })
                    });
                    
                    if (response.ok) {
                        window.location.reload();
                    } else {
                        const data = await response.json();
                        alert(data.error || 'Failed to save expense');
                    }
                } catch(e) {
                    console.error(e);
                    alert('Network error');
                } finally {
                    this.isSaving = false;
                }
            }
        };
    }
</script>
{% endblock %}
